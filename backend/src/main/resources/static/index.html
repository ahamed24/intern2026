<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Chat</title>
<style>
  :root {
    --bg: #e8edf3;
    --panel: #ffffff;
    --ink: #17233b;
    --muted: #66738a;
    --line: #d6dde8;
    --mine: #17233b;
    --mine-ink: #ffffff;
    --theirs: #eef2f7;
    --accent: #1f7a6d;
    --warn: #c47d00;
    --bad: #b3372f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1623;
      --panel: #172033;
      --ink: #e8edf6;
      --muted: #8d9ab1;
      --line: #27324a;
      --mine: #3a6ea5;
      --mine-ink: #ffffff;
      --theirs: #202b42;
      --accent: #46b8a6;
      --warn: #e0a030;
      --bad: #e0706a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    height: min(760px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .join { height: auto; padding: 28px; gap: 16px; max-width: 420px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  .lede { margin: 0; color: var(--muted); }
  label { display: block; font-size: .875rem; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  details summary { cursor: pointer; color: var(--muted); font-size: .875rem; }
  details div { margin-top: 8px; }
  .hint { font-size: .8rem; color: var(--muted); margin: 6px 0 0; }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  header .title { font-weight: 700; }
  header .who {
    color: var(--muted);
    font-size: .85rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .status { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
  .status[data-state="open"] .dot { background: var(--accent); }
  .status[data-state="closed"] .dot { background: var(--bad); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  .msg { max-width: 82%; display: flex; flex-direction: column; align-items: flex-start; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .meta { font-size: .75rem; color: var(--muted); margin: 0 4px 2px; }
  .bubble {
    background: var(--theirs);
    padding: 8px 12px;
    border-radius: 14px 14px 14px 4px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .mine .bubble { background: var(--mine); color: var(--mine-ink); border-radius: 14px 14px 4px 14px; }
  .system { align-self: center; font-size: .8rem; color: var(--muted); }

  form.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  form.composer input { flex: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!--
  SERVER CONFIG
  When this page is hosted separately from the backend, set the WebSocket URL here
  (use wss:// if your page is served over https://).
  People can also override it on the join screen; the override is remembered in their browser.
-->
<script>
  window.CHAT_SERVER_URL = "";
</script>

<main id="join" class="card join">
  <div>
    <h1>Simple Chat</h1>
    <p class="lede">Pick a name and join the room.</p>
  </div>
  <form id="joinForm" style="display:grid;gap:14px">
    <div>
      <label for="name">Your name</label>
      <input id="name" maxlength="20" autocomplete="nickname" required autofocus>
    </div>
    <details>
      <summary>Server settings</summary>
      <div>
        <label for="server">WebSocket URL</label>
        <input id="server" inputmode="url" spellcheck="false">
        <p class="hint">Use wss:// when this page is on https://.</p>
      </div>
    </details>
    <button type="submit">Join chat</button>
  </form>
</main>

<section id="chat" class="card" hidden>
  <header>
    <span class="title">Room</span>
    <span class="who" id="who"></span>
    <span class="status" id="status" data-state="connecting"><span class="dot"></span><span id="statusText">Connecting</span></span>
  </header>
  <div id="messages" aria-live="polite"></div>
  <form class="composer" id="composer">
    <input id="text" maxlength="500" placeholder="Write a message" autocomplete="off" aria-label="Message">
    <button type="submit" id="send" disabled>Send</button>
  </form>
</section>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const joinEl = $("join"), chatEl = $("chat"), messagesEl = $("messages");
  const statusEl = $("status"), statusText = $("statusText"), whoEl = $("who");
  const textEl = $("text"), sendBtn = $("send");

  const saved = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  // Empty CHAT_SERVER_URL means "same host as this page" (used when the backend serves this file).
  const defaultUrl = window.CHAT_SERVER_URL ||
    (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/chat";

  $("name").value = saved("chat.name") || "";
  $("server").value = saved("chat.server") || defaultUrl;

  let ws = null, myName = "", serverUrl = "", retryTimer = null, joined = false;

  function setStatus(state, label) {
    statusEl.dataset.state = state;
    statusText.textContent = label;
    sendBtn.disabled = state !== "open";
  }

  function connect() {
    clearTimeout(retryTimer);
    setStatus("connecting", "Connecting");
    try { ws = new WebSocket(serverUrl); }
    catch (e) { setStatus("closed", "Bad server URL"); return; }

    ws.onopen = () => {
      setStatus("open", "Online");
      ws.send(JSON.stringify({ type: "join", name: myName }));
    };
    ws.onmessage = (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      handle(data);
    };
    ws.onclose = () => {
      setStatus("closed", "Reconnecting");
      if (joined) retryTimer = setTimeout(connect, 2000);
    };
    ws.onerror = () => { /* onclose follows */ };
  }

  function handle(d) {
    if (d.type === "history") {
      messagesEl.innerHTML = "";
      (d.messages || []).forEach(addMessage);
      if (!messagesEl.children.length) showEmpty();
    } else if (d.type === "message" || d.type === "system") {
      addMessage(d);
    } else if (d.type === "users") {
      const n = (d.users || []).length;
      whoEl.textContent = n + (n === 1 ? " person" : " people") + ": " + (d.users || []).join(", ");
    }
  }

  function showEmpty() {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No messages yet. Say hello.";
    messagesEl.appendChild(p);
  }

  function addMessage(m) {
    const empty = messagesEl.querySelector(".empty");
    if (empty) empty.remove();
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;

    if (m.type === "system") {
      const s = document.createElement("div");
      s.className = "system";
      s.textContent = m.text;
      messagesEl.appendChild(s);
    } else {
      const mine = m.name === myName;
      const wrap = document.createElement("div");
      wrap.className = "msg" + (mine ? " mine" : "");
      const meta = document.createElement("div");
      meta.className = "meta";
      const t = m.time ? new Date(m.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
      meta.textContent = (mine ? "You" : m.name) + (t ? "  " + t : "");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = m.text;   // textContent: no HTML injection
      wrap.append(meta, bubble);
      messagesEl.appendChild(wrap);
    }
    if (nearBottom || m.name === myName) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  $("joinForm").addEventListener("submit", (e) => {
    e.preventDefault();
    myName = $("name").value.trim();
    serverUrl = $("server").value.trim() || defaultUrl;
    if (!myName) return;
    save("chat.name", myName);
    save("chat.server", serverUrl);
    joined = true;
    joinEl.hidden = true;
    chatEl.hidden = false;
    connect();
    textEl.focus();
  });

  $("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = textEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "message", text }));
    textEl.value = "";
    textEl.focus();
  });
})();
</script>
</body>
</html>
